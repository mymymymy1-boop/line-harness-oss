name = "line-harness"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

account_id = "bf4d6f5cd8caf5fbb0a20c6841c5de38"

[vars]
# Kindle Factory の登録計測 webhook。本ごとのLINE登録を Kindle 側 /analytics に集計する。
KINDLE_TRACK_URL = "https://kindle.bizsp.net/track/register"

[assets]
directory = "dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "line-harness"
database_id = "f9fa851c-c58b-44d8-8b6c-c2fce18caa15"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *"]
